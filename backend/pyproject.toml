[project]
name = "plutus-backend"
version = "0.1.0"
description = "backend"
authors = [
    {name = "TMH-LZC"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "reportlab (>=4.5.1,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "yfinance (>=1.4.1,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app" }
]

[project.scripts]
dev = "uvicorn.main:main"
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
