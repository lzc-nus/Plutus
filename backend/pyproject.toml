[project]
name = "orbital-backend"
version = "0.1.0"
description = "backend"
authors = [
    {name = "TMH-LZC"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "reportlab (>=4.5.1,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dev = "uvicorn.main:main"